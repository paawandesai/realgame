[package]
name = "voxel-bench3d"
version = "0.1.0"
edition = "2021"
description = "Spike: cost of a 3D falling-sand step on awake 16^3 chunks (native and WASM)"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bench3d"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
