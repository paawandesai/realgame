[package]
name = "realgame-bevy-client"
version = "0.1.0"
edition = "2021"
description = "First-person 3D prototype: real chemistry is magic, in a small courtyard"
publish = false

# Its own workspace, so Bevy's large dependency tree stays out of the main
# workspace's lockfile, `cargo clippy --all-targets` and CI.
[workspace]

[[bin]]
name = "bevy-client"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "bevy_winit",
    "bevy_window",
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_color",
    "keyboard",
    "mouse",
    "bevy_anti_alias",
] }
# Spells as data (content/spells.json) and the sourced reaction table, without
# the 2D game or its wasm-bindgen exports.
realgame-sim = { path = "../sim", default-features = false }
# I-052 block world: the voxel grid and the block chemistry, both pure Rust
# with no Bevy dependency (a future server and the VR client reuse them).
realgame-voxel = { path = "../voxel" }
realgame-matter = { path = "../matter" }

[features]
default = ["bloom", "webgl2"]
# The web graphics API is chosen at build time: Bevy's `webgpu` overrides
# `webgl2`, so a site that wants both ships two .wasm files and picks one in
# JavaScript (`navigator.gpu`). Ignored on native.
webgl2 = ["bevy/webgl2"]
webgpu = ["bevy/webgpu"]
# HDR bloom and the default (LUT-based) tonemapper. Without it the build is
# smaller and uses the Reinhard tonemapper (`--no-default-features`).
bloom = ["bevy/bevy_post_process", "bevy/tonemapping_luts", "bevy/ktx2", "bevy/zstd_rust"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["web"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Performance"] }
js-sys = "0.3"
wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["x11"] }

# Size-optimised. opt-level 3 cut the CPU frame median at low@4x by about
# 20% but grew brotli from 3.56 to 4.60 MB and TTI by about 1.4 s (see
# docs/loop/items/I-015/); that trade is item I-024.
# I-024 (docs/loop/items/I-024/lanes/build/round-1.md) measured per-crate
# overrides in paired rounds against this profile and kept none:
#   P1, our crate at 3 and deps at z: CPU 0.960 x base at low@4x (30.9 vs
#     32.2 ms), brotli +0.06 MB; misses the 0.92 bar. A breaker rerun gave
#     0.997 (28.7 vs 28.8 ms), so the gain is inside the noise, not reproduced.
#   P2, P1 plus ten hot bevy/wgpu/glam crates at 3: CPU 0.909 x (29.0 vs
#     31.9 ms) but only 3/5 paired wins and brotli +0.83 MB (3.56 -> 4.39).
#     Base vs base spread was 1.055 at 5 pairs, so P2 is plausible but
#     unproven; a follow-up needs more rounds.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The smooth mesher (realgame-voxel) remeshes chunks inside the frame
# budget; it is small, so it is speed-optimised (smooth-world lane).
[profile.release.package.realgame-voxel]
opt-level = 3

# Same as release but speed-optimised, to compare size against opt-level z.
[profile.release-speed]
inherits = "release"
opt-level = 3
