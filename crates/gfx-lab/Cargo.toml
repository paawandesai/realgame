[package]
name = "realgame-gfx-lab"
version = "0.1.0"
edition = "2021"
description = "Graphics G0 spike: which Bevy rendering features run on WebGL2 and WebGPU, plus the Bench molecule renderer prototype"
publish = false

# Own workspace, like bevy-client: Bevy stays out of the main workspace and CI.
[workspace]

[[bin]]
name = "gfx-lab"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "bevy_winit",
    "bevy_window",
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_color",
    "bevy_anti_alias",
    "bevy_post_process",
] }

[features]
default = ["webgl2"]
webgl2 = ["bevy/webgl2"]
webgpu = ["bevy/webgpu"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["web"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Performance"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["x11"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
