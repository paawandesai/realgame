# cargo-deny: checks Rust dependencies for known vulnerabilities, licences
# we can't ship, duplicate versions and untrusted sources.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Bevy client (crates/bevy-client, its own workspace, checked with
# --manifest-path): permissive licences outside the list above, allowed only
# for the crates that use them.
[[licenses.exceptions]]
crate = "encase"
allow = ["MIT-0"]
[[licenses.exceptions]]
crate = "encase_derive"
allow = ["MIT-0"]
[[licenses.exceptions]]
crate = "encase_derive_impl"
allow = ["MIT-0"]
[[licenses.exceptions]]
crate = "libloading"
allow = ["ISC"]
